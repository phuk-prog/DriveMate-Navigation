name: Independent RoutingKit algorithm benchmark
on:
  push:
    branches: ['benchmarks/more-engines-ranking-20261014']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: new-routingkit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-routingkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile pinned BSD-2-Clause RoutingKit outside candidate
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/RoutingKit/RoutingKit.git "$RUNNER_TEMP/RoutingKit"
          git -C "$RUNNER_TEMP/RoutingKit" checkout 54d49bb0cdea56dde182357522e4e86a03c57852
          test "$(git -C "$RUNNER_TEMP/RoutingKit" rev-parse HEAD)" = 54d49bb0cdea56dde182357522e4e86a03c57852
          make -C "$RUNNER_TEMP/RoutingKit" -j2 lib/libroutingkit.a
          g++ -std=c++17 -O2 -I"$RUNNER_TEMP/RoutingKit/include" benchmarks/routingkit_ch_adapter.cpp "$RUNNER_TEMP/RoutingKit/lib/libroutingkit.a" -fopenmp -pthread -o "$RUNNER_TEMP/routingkit_fixture"
      - name: Execute actual source-pinned engine and regression
        run: |
          python -m unittest tests.test_routingkit_reference -v
          python -m benchmarks.routingkit_reference --binary "$RUNNER_TEMP/routingkit_fixture" --revision 54d49bb0cdea56dde182357522e4e86a03c57852
          python -m tools.privacy_guard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: routingkit-real-evidence
          path: results/routingkit/comparison.json
          retention-days: 14
