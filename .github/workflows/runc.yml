name: Run C simulated drives (categories 3, 4, 6, 12, 13, 16, 19, 20), seven engines
# 24 frozen journeys, each driven normally, with a GPS dropout and with a wrong turn (simulated
# GPS on real OSM clips). Engines run in parallel; each category is scored and summarised
# separately, never as one total. Every clip must match its frozen hash.
on:
  workflow_dispatch:
  # A new workflow can only be started by hand once it is on the default branch,
  # so a push that changes the test itself also runs it (research branches only).
  push:
    branches: ['claude/**', 'codex/**', 'ccr-**']
    paths:
      - 'benchmarks/run_c.py'
      - 'config/runc-prepared.json'
      - '.github/workflows/runc.yml'
      - 'gps/**'
      # an engine or importer change re-runs the whole test for every engine (owner rule 6)
      - 'engine/**'
      - 'map_data/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: runc-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_JAR_URL: https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar
  GH_JAR_SHA1: 6e6c173c2b46cb0a3c1df124b2144d557931597e
jobs:
  engine:
    name: Drives and routes - ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        run: [DMN, OSRM, GraphHopper, Valhalla, openrouteservice, BRouter, OsmAnd]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned inputs (verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          raw=https://raw.githubusercontent.com/${{ github.repository }}
          mkdir -p results/turn001 results/runc
          (cd results/turn001 && curl -fsSL -o SHA256SUMS "$raw/data/turn001-snapshot/SHA256SUMS" \
            && curl -fsSL -o gm.osm.pbf "$raw/data/turn001-snapshot/gm.osm.pbf" && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Java and jar
        if: matrix.run == 'GraphHopper'
        run: |
          set -euo pipefail
          mkdir -p results/turn001/engines
          curl -fsSL -o results/turn001/engines/gh.jar "$GH_JAR_URL"
          echo "$GH_JAR_SHA1  results/turn001/engines/gh.jar" | sha1sum -c -
          sudo mkdir -p /opt/jdk17/bin && sudo ln -sf "$JAVA_HOME_17_X64/bin/java" /opt/jdk17/bin/java
      - name: Java 25 for openrouteservice 10.1
        if: matrix.run == 'openrouteservice'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - name: Java 21 for OsmAnd (router helper is compiled on the runner)
        if: matrix.run == 'OsmAnd'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Run ${{ matrix.run }} (log kept as artifact, not printed)
        run: |
          set -euo pipefail
          python -m benchmarks.run_c run --engine ${{ matrix.run }} > results/runc/run.log 2>&1 || { tail -20 results/runc/run.log; exit 1; }
          awk '{print $2, $3}' results/runc/run.log | sort | uniq -c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runc-${{ matrix.run }}
          path: |
            results/runc/run-*.json
            results/runc/run.log
          retention-days: 30
  score:
    needs: engine
    if: always() && needs.engine.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Collect results of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'runc-*' -D artifacts
          mkdir -p results/runc && cp artifacts/*/*.json results/runc/
      - name: Score and short summary
        run: |
          set -euo pipefail
          python -m benchmarks.run_c score
          python -m benchmarks.run_c brief | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runc-summary
          path: results/runc/summary.json
          retention-days: 90
