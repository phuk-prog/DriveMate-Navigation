# GraphHopper 11.1, isolated public-road benchmark. No personal data.
# The input PBF and graph cache reside only in git-ignored results/.
graphhopper:
  datareader.file: results/public-graphhopper-subset.osm.pbf
  graph.location: results/graphhopper-cache
  profiles:
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
      custom_model_files: [car.json]
  profiles_ch:
    - profile: car
  profiles_lm: []
  graph.encoded_values: car_access,car_average_speed,road_access
  import.osm.ignored_highways: footway,construction,cycleway,path,steps
  prepare.min_network_size: 10
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
logging:
  appenders:
    - type: console
