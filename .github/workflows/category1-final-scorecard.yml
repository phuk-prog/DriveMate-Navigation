name: Category 1 frozen multi-cohort evidence closeout
# Artifact-only reproducibility check. No engine installs, road data
# downloads, accounts, competitor reruns or Android code.
on:
  push:
    branches: ['codex/dmn-category1-completion-20261017']
    paths:
      - 'tools/category1_final_scorecard.py'
      - '.github/workflows/category1-final-scorecard.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: category1-final-scorecard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch only previously recorded job artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/map001 evidence/turn001 evidence/barrier001 evidence/endpoint evidence/heading
          gh run download 39018620653 -R "${{ github.repository }}" -n map001-v3-manchester-and-valhalla-graph-facts -D evidence/map001
          gh run download 39019749346 -R "${{ github.repository }}" -n turn001-summary -D evidence/turn001
          gh run download 39026846188 -R "${{ github.repository }}" -n barrier001-summary -D evidence/barrier001
          gh run download 39028874337 -R "${{ github.repository }}" -n turn001-endpoint-diagnostic -D evidence/endpoint
          gh run download 39029550716 -R "${{ github.repository }}" -n category1-graphhopper-heading-trial -D evidence/heading
      - name: Verify all separate Category 1 cohorts and report
        run: |
          set -euo pipefail
          python -m py_compile tools/category1_final_scorecard.py
          python -m tools.category1_final_scorecard --evidence-dir evidence > /tmp/category1-scorecard.txt
          cat results/category1-final/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: category1-final-scorecard
          path: |
            results/category1-final/scorecard.json
            results/category1-final/scorecard.md
          retention-days: 90
