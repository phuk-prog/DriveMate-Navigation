name: Run B1 JOURNEY-001 real junctions and roundabouts (categories 5, 6, 8, 9, 11), six engines
# Runs the frozen JOURNEY-001 cohort on GitHub (public repo: free minutes). Engines run in
# parallel; each category is scored and summarised separately, never as one total. Each job
# cuts the 3 km clips from the pinned map and every clip must match its frozen hash.
on:
  workflow_dispatch:
  # A new workflow can only be started by hand once it is on the default branch,
  # so a push that changes the test itself also runs it (research branches only).
  push:
    branches: ['claude/**', 'codex/**', 'ccr-**']
    paths:
      - 'benchmarks/journey001.py'
      - 'benchmarks/access001_route.py'
      - 'benchmarks/extra_engines.py'
      - 'config/journey001-*.json'
      - '.github/workflows/journey001.yml'
      # an engine or importer change re-runs the whole test for every engine (owner rule 6)
      - 'engine/**'
      - 'map_data/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: journey001-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_JAR_URL: https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar
  GH_JAR_SHA1: 6e6c173c2b46cb0a3c1df124b2144d557931597e
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        run: [DMN, OSRM, GraphHopper, Valhalla, openrouteservice, BRouter]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned inputs (verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          raw=https://raw.githubusercontent.com/${{ github.repository }}
          mkdir -p results/turn001 results/journey001
          (cd results/turn001 && curl -fsSL -o SHA256SUMS "$raw/data/turn001-snapshot/SHA256SUMS" \
            && curl -fsSL -o gm.osm.pbf "$raw/data/turn001-snapshot/gm.osm.pbf" && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Java and jar
        if: matrix.run == 'GraphHopper'
        run: |
          set -euo pipefail
          mkdir -p results/turn001/engines
          curl -fsSL -o results/turn001/engines/gh.jar "$GH_JAR_URL"
          echo "$GH_JAR_SHA1  results/turn001/engines/gh.jar" | sha1sum -c -
          sudo mkdir -p /opt/jdk17/bin && sudo ln -sf "$JAVA_HOME_17_X64/bin/java" /opt/jdk17/bin/java
      - name: Java 25 for openrouteservice 10.1
        if: matrix.run == 'openrouteservice'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - name: Run ${{ matrix.run }} (log kept as artifact, not printed)
        run: |
          set -euo pipefail
          python -m benchmarks.journey001 run --engine ${{ matrix.run }} > results/journey001/run.log 2>&1 || { tail -20 results/journey001/run.log; exit 1; }
          awk '{print $2, $3}' results/journey001/run.log | sort | uniq -c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: journey001-${{ matrix.run }}
          path: |
            results/journey001/run-*.json
            results/journey001/run.log
          retention-days: 30
  score:
    needs: engine
    if: always() && needs.engine.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Collect engine results of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'journey001-*' -D artifacts
          mkdir -p results/journey001 && cp artifacts/*/run-*.json results/journey001/
      - name: Score and short summary
        run: |
          set -euo pipefail
          python -m benchmarks.journey001 score
          python -m benchmarks.journey001 brief | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: journey001-summary
          path: results/journey001/summary.json
          retention-days: 90
