name: GPS-001 openrouteservice snapping reference
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ors-gps001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trial:
    if: contains(github.event.pull_request.title, '[ors-gps001]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify frozen contract and DMN
        run: |
          python -m tools.privacy_guard
          python -m unittest discover -s tests -q
          python -m benchmarks.navigation_trial --engine DMN --output results/gps001-DMN.json
      - name: Prepare identical invented map and integrity-checked official ORS
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq osmium-tool >/dev/null
          osmium cat benchmarks/fixtures/synthetic-gps-001.xml -o results/gps001.osm.pbf
          curl -fsSL --retry 2 --max-time 180 https://github.com/GIScience/openrouteservice/releases/download/v10.1.0/ors.jar -o "${RUNNER_TEMP}/ors.jar"
          printf '%s  %s\n' '46b83b353eaf8830a1b53cad91d027e00547cd9a00e86efddd64a45335bfb8e1' "${RUNNER_TEMP}/ors.jar" | sha256sum --check
          ORS_CONFIG_LOCATION="$PWD/config/ors-gps001.yml" java -Xms128m -Xmx1536m -jar "${RUNNER_TEMP}/ors.jar" > "${RUNNER_TEMP}/ors-gps001.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/ors-gps001.pid"
      - name: Execute actual pointwise snapping against six frozen cases
        run: |
          python -m benchmarks.navigation_trial --engine openrouteservice --output results/gps001-openrouteservice.json
          python -m benchmarks.navigation_trial --reports results/gps001-DMN.json results/gps001-openrouteservice.json --output results/gps001-ors-scorecard.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gps001-openrouteservice
          path: results/gps001-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: ORS diagnostic startup log
        if: failure()
        run: tail -100 "${RUNNER_TEMP}/ors-gps001.log" || true
      - name: Cleanup
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/ors-gps001.pid" ]; then kill "$(cat "${RUNNER_TEMP}/ors-gps001.pid")" 2>/dev/null || true; fi
          rm -f "${RUNNER_TEMP}/ors.jar"
          rm -rf results/ors-graphs
