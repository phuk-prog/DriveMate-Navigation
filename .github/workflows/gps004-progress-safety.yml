name: GPS-004 adjacent-fragment progress safety
on:
  pull_request:
    paths:
      - 'gps/**'
      - 'benchmarks/gps_progress_safety_baseline.py'
      - 'benchmarks/fixtures/synthetic-gps-004.json'
      - 'tests/test_gps_progress_safety_baseline.py'
      - 'config/dmn-separated-category-tests.json'
      - '.github/workflows/gps004-progress-safety.yml'
permissions:
  contents: read
concurrency:
  group: gps004-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify repository and execute frozen baseline
        run: |
          python -m tools.privacy_guard
          python -m unittest discover -s tests -q
          mkdir -p results
          python -m benchmarks.gps_progress_safety_baseline --output results/gps004-baseline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gps004-progress-safety-baseline
          path: results/gps004-baseline.json
          if-no-files-found: error
          retention-days: 30
