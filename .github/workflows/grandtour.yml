name: GRAND-TOUR-001 one long UK drive, everything DMN should do, seven engines
# One job on one machine: every engine, one after another, gets the same frozen map, start
# and finish (Manchester city centre -> moor lane above Newhey: city, A-road, M62, country
# lane), wrong-turn points and traffic jam; DMN also drives the whole journey live with
# simulated GPS drop-outs. Each category is ranked separately in the job summary.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'codex/**', 'ccr-**']
    paths:
      - 'benchmarks/grand_tour.py'
      - 'config/grandtour-prepared.json'
      - '.github/workflows/grandtour.yml'
permissions:
  contents: read
concurrency:
  group: grandtour-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_JAR_URL: https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar
  GH_JAR_SHA1: 6e6c173c2b46cb0a3c1df124b2144d557931597e
jobs:
  tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Java 25 (openrouteservice) and 21 (OsmAnd, BRouter; default)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: |
            25
            21
      - name: Pinned inputs (verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          raw=https://raw.githubusercontent.com/${{ github.repository }}
          mkdir -p results/turn001/engines results/grandtour
          (cd results/turn001 && curl -fsSL -o SHA256SUMS "$raw/data/turn001-snapshot/SHA256SUMS" \
            && curl -fsSL -o gm.osm.pbf "$raw/data/turn001-snapshot/gm.osm.pbf" && sha256sum -c --ignore-missing SHA256SUMS)
          curl -fsSL -o results/turn001/engines/gh.jar "$GH_JAR_URL"
          echo "$GH_JAR_SHA1  results/turn001/engines/gh.jar" | sha1sum -c -
          sudo mkdir -p /opt/jdk17/bin && sudo ln -sf "$JAVA_HOME_17_X64/bin/java" /opt/jdk17/bin/java
      - name: Run every engine (log kept as artifact, not printed)
        run: |
          set -euo pipefail
          export ORS_JAVA="$JAVA_HOME_25_X64/bin/java"
          python -m benchmarks.grand_tour run > results/grandtour/run.log 2>&1 || { tail -30 results/grandtour/run.log; exit 1; }
          grep -E "^(running|DMN|OSRM|Valhalla|GraphHopper|openrouteservice|BRouter|OsmAnd) " results/grandtour/run.log | cut -c1-300
      - name: Score and short summary
        if: always()
        run: |
          set -euo pipefail
          python -m benchmarks.grand_tour score > results/grandtour/score.log 2>&1 || { tail -30 results/grandtour/score.log; exit 1; }
          python -m benchmarks.grand_tour brief | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grandtour
          path: |
            results/grandtour/run-*.json
            results/grandtour/summary.json
            results/grandtour/*.log
          retention-days: 90
