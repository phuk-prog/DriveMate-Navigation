name: Shared work register (REGISTER.md on main)
# Rebuilds REGISTER.md on main from work/items on EVERY branch, so any AI that
# starts from main sees what all the others have done, hold and plan. Runs when a
# branch pushes work/ changes, every 30 minutes as a safety net, or by hand.
# Lightweight: one checkout and a Python script, no engines.
on:
  push:
    paths: ['work/**', 'tools/work_status.py']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: work-register
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Rebuild REGISTER.md from all branches and commit if it changed
        run: |
          set -euo pipefail
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          python -m tools.work_status render
          if ! git diff --quiet -- REGISTER.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add REGISTER.md
            git commit -q -m "REGISTER.md: rebuilt from work/ on all branches [skip ci]"
            git push -q origin HEAD:main
          fi
