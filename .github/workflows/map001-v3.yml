name: MAP-001 v3 frozen relation closure and Valhalla metadata
on:
  pull_request:
    paths:
      - 'benchmarks/map001_v3.py'
      - 'benchmarks/map001_valhalla_locate.py'
      - 'tests/test_map001_v3.py'
      - 'tests/test_map001_valhalla_locate.py'
      - '.github/workflows/map001-v3.yml'
permissions:
  contents: read
concurrency:
  group: map001-v3-only
  cancel-in-progress: false
jobs:
  map001-v3:
    if: contains(github.event.pull_request.title, '[map001-v3]')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run unit controls and privacy check
        run: |
          set -euo pipefail
          python -m tools.privacy_guard
          python -m unittest discover -s tests -p 'test_map001_v3.py' -v
          python -m unittest discover -s tests -p 'test_map001_valhalla_locate.py' -v
          mkdir -p results
      - name: Download bounded public UK OSM sources once
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 120 --get --data-urlencode 'bbox=-2.248,53.479,-2.244,53.483' https://api.openstreetmap.org/api/0.6/map -o results/map001-manchester.osm
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 120 --get --data-urlencode 'bbox=-1.895,52.477,-1.891,52.481' https://api.openstreetmap.org/api/0.6/map -o results/map001-birmingham.osm
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 120 --get --data-urlencode 'bbox=-2.936,54.892,-2.932,54.896' https://api.openstreetmap.org/api/0.6/map -o results/map001-carlisle.osm
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 120 --get --data-urlencode 'bbox=-3.182,51.480,-3.178,51.484' https://api.openstreetmap.org/api/0.6/map -o results/map001-cardiff.osm
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 120 --get --data-urlencode 'bbox=-4.254,55.860,-4.250,55.864' https://api.openstreetmap.org/api/0.6/map -o results/map001-glasgow.osm
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 120 --get --data-urlencode 'bbox=-5.932,54.599,-5.928,54.603' https://api.openstreetmap.org/api/0.6/map -o results/map001-belfast.osm
      - name: Close missing relation members and freeze sources
        run: |
          set -euo pipefail
          python -m benchmarks.map001_v3 close
          python -m benchmarks.map001_v3 freeze
          python -m benchmarks.map001_v3 score
      - name: Build local Valhalla graph from frozen Manchester source
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq osmium-tool >/dev/null
          osmium cat results/map001-manchester.osm -o results/map001-v3-manchester.osm.pbf
          IMAGE='ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956'
          docker pull "$IMAGE"
          mkdir -p results/valhalla
          cp results/map001-v3-manchester.osm.pbf results/valhalla/
          docker run -d --rm --name map001-v3-valhalla -p 127.0.0.1:8002:8002 -v "$PWD/results/valhalla:/custom_files" -e build_admins=False -e build_time_zones=False -e build_elevation=False -e build_tar=False -e server_threads=2 "$IMAGE"
          python - <<'PY'
          from benchmarks.valhalla_live_reference import wait_for_local_router
          wait_for_local_router(150)
          PY
          python -m benchmarks.map001_valhalla_locate
      - name: Preserve v3 exact source bytes, decisions and adapter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: map001-v3-frozen-osm-closure-and-valhalla
          path: |
            results/map001-*.osm
            results/map001-v3-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Failure diagnostics
        if: failure()
        run: docker logs map001-v3-valhalla 2>/dev/null | tail -50 || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f map001-v3-valhalla >/dev/null 2>&1 || true
          sudo rm -rf results/valhalla results/map001-v3-manchester.osm.pbf
