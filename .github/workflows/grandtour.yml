name: GRAND-TOUR-001 one long UK drive, everything DMN should do, seven engines
# Sections side by side (owner, 17 Oct 2026): one machine per engine (same frozen map, start and
# finish: Manchester city centre -> moor lane above Newhey; wrong-turn points; traffic jam;
# DMN also drives the whole journey live), plus one machine timing every engine (speed is only
# compared on one machine), then scoring. Each category is ranked separately in the summary.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'codex/**', 'ccr-**']
    paths:
      - 'benchmarks/grand_tour.py'
      - 'config/grandtour-prepared.json'
      - '.github/workflows/grandtour.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: grandtour-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_JAR_URL: https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar
  GH_JAR_SHA1: 6e6c173c2b46cb0a3c1df124b2144d557931597e
jobs:
  engine:
    name: Drive and routes - ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        run: [DMN, OSRM, GraphHopper, Valhalla, openrouteservice, BRouter, OsmAnd]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Java 25 (openrouteservice) and 21 (OsmAnd, BRouter; default)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: |
            25
            21
      - name: Pinned inputs (verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          raw=https://raw.githubusercontent.com/${{ github.repository }}
          mkdir -p results/turn001/engines results/grandtour
          (cd results/turn001 && curl -fsSL -o SHA256SUMS "$raw/data/turn001-snapshot/SHA256SUMS" \
            && curl -fsSL -o gm.osm.pbf "$raw/data/turn001-snapshot/gm.osm.pbf" && sha256sum -c --ignore-missing SHA256SUMS)
          curl -fsSL -o results/turn001/engines/gh.jar "$GH_JAR_URL"
          echo "$GH_JAR_SHA1  results/turn001/engines/gh.jar" | sha1sum -c -
          sudo mkdir -p /opt/jdk17/bin && sudo ln -sf "$JAVA_HOME_17_X64/bin/java" /opt/jdk17/bin/java
      - name: Run ${{ matrix.run }} (log kept as artifact, not printed)
        run: |
          set -euo pipefail
          export ORS_JAVA="$JAVA_HOME_25_X64/bin/java"
          python -m benchmarks.grand_tour run --engines ${{ matrix.run }} > results/grandtour/run.log 2>&1 || { tail -30 results/grandtour/run.log; exit 1; }
          tail -3 results/grandtour/run.log | cut -c1-300
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grandtour-${{ matrix.run }}
          path: |
            results/grandtour/run-*.json
            results/grandtour/run.log
          retention-days: 90
  speed:
    name: Route time, every engine on one machine
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Java 25 (openrouteservice) and 21 (OsmAnd, BRouter; default)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: |
            25
            21
      - name: Pinned inputs (verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          raw=https://raw.githubusercontent.com/${{ github.repository }}
          mkdir -p results/turn001/engines results/grandtour
          (cd results/turn001 && curl -fsSL -o SHA256SUMS "$raw/data/turn001-snapshot/SHA256SUMS" \
            && curl -fsSL -o gm.osm.pbf "$raw/data/turn001-snapshot/gm.osm.pbf" && sha256sum -c --ignore-missing SHA256SUMS)
          curl -fsSL -o results/turn001/engines/gh.jar "$GH_JAR_URL"
          echo "$GH_JAR_SHA1  results/turn001/engines/gh.jar" | sha1sum -c -
          sudo mkdir -p /opt/jdk17/bin && sudo ln -sf "$JAVA_HOME_17_X64/bin/java" /opt/jdk17/bin/java
      - name: Time every engine
        run: |
          set -euo pipefail
          export ORS_JAVA="$JAVA_HOME_25_X64/bin/java"
          python -m benchmarks.grand_tour speed > results/grandtour/speed.log 2>&1 || { tail -30 results/grandtour/speed.log; exit 1; }
          grep "^speed" results/grandtour/speed.log | cut -c1-200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grandtour-speed
          path: |
            results/grandtour/speed.json
            results/grandtour/speed.log
          retention-days: 90
  score:
    needs: [engine, speed]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned inputs (verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          raw=https://raw.githubusercontent.com/${{ github.repository }}
          mkdir -p results/turn001 results/grandtour
          (cd results/turn001 && curl -fsSL -o SHA256SUMS "$raw/data/turn001-snapshot/SHA256SUMS" \
            && curl -fsSL -o gm.osm.pbf "$raw/data/turn001-snapshot/gm.osm.pbf" && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Collect the sections of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'grandtour-*' -D artifacts
          cp artifacts/*/*.json results/grandtour/
      - name: Score and short summary
        run: |
          set -euo pipefail
          python -m benchmarks.grand_tour score > results/grandtour/score.log 2>&1 || { tail -30 results/grandtour/score.log; exit 1; }
          python -m benchmarks.grand_tour brief | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grandtour-summary
          path: |
            results/grandtour/summary.json
            results/grandtour/score.log
          retention-days: 90
