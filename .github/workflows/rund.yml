name: Run D quick checks (categories 7, 14, 17, 18, 21), seven engines
# Each category is scored and summarised separately, never as one total. Speed (7) and the
# adapter checks (21) run every engine on ONE machine, case by case, so times are comparable;
# closures (14), damaged maps (17) and bad requests (18) run per engine in parallel. Every
# clip is cut from the pinned map and must match its frozen hash.
on:
  workflow_dispatch:
  # A new workflow can only be started by hand once it is on the default branch,
  # so a push that changes the test itself also runs it (research branches only).
  push:
    branches: ['claude/**', 'codex/**', 'ccr-**']
    paths:
      - 'benchmarks/run_d.py'
      - 'tools/rund/**'
      - 'config/rund-prepared.json'
      - '.github/workflows/rund.yml'
      # an engine or importer change re-runs the whole test for every engine (owner rule 6)
      - 'engine/**'
      - 'map_data/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: rund-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_JAR_URL: https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar
  GH_JAR_SHA1: 6e6c173c2b46cb0a3c1df124b2144d557931597e
jobs:
  speed:
    name: Speed and adapter checks (7, 21), all engines on one machine
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Java 25 (openrouteservice) and 21 (OsmAnd, BRouter; default)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: |
            25
            21
      - name: Pinned inputs (verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          raw=https://raw.githubusercontent.com/${{ github.repository }}
          mkdir -p results/turn001/engines results/rund
          (cd results/turn001 && curl -fsSL -o SHA256SUMS "$raw/data/turn001-snapshot/SHA256SUMS" \
            && curl -fsSL -o gm.osm.pbf "$raw/data/turn001-snapshot/gm.osm.pbf" && sha256sum -c --ignore-missing SHA256SUMS)
          curl -fsSL -o results/turn001/engines/gh.jar "$GH_JAR_URL"
          echo "$GH_JAR_SHA1  results/turn001/engines/gh.jar" | sha1sum -c -
          sudo mkdir -p /opt/jdk17/bin && sudo ln -sf "$JAVA_HOME_17_X64/bin/java" /opt/jdk17/bin/java
      - name: Run (log kept as artifact, not printed)
        run: |
          set -euo pipefail
          export ORS_JAVA="$JAVA_HOME_25_X64/bin/java"
          python -m benchmarks.run_d speed > results/rund/speed.log 2>&1 || { tail -20 results/rund/speed.log; exit 1; }
          awk '{print $2, $3}' results/rund/speed.log | sort | uniq -c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rund-speed
          path: |
            results/rund/speed.json
            results/rund/speed.log
          retention-days: 30
  engine:
    name: Closures, damaged maps, bad requests (14, 17, 18) - ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        run: [DMN, OSRM, GraphHopper, Valhalla, openrouteservice, BRouter, OsmAnd]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned inputs (verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          raw=https://raw.githubusercontent.com/${{ github.repository }}
          mkdir -p results/turn001 results/rund
          (cd results/turn001 && curl -fsSL -o SHA256SUMS "$raw/data/turn001-snapshot/SHA256SUMS" \
            && curl -fsSL -o gm.osm.pbf "$raw/data/turn001-snapshot/gm.osm.pbf" && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Java and jar
        if: matrix.run == 'GraphHopper'
        run: |
          set -euo pipefail
          mkdir -p results/turn001/engines
          curl -fsSL -o results/turn001/engines/gh.jar "$GH_JAR_URL"
          echo "$GH_JAR_SHA1  results/turn001/engines/gh.jar" | sha1sum -c -
          sudo mkdir -p /opt/jdk17/bin && sudo ln -sf "$JAVA_HOME_17_X64/bin/java" /opt/jdk17/bin/java
      - name: Java 25 for openrouteservice 10.1
        if: matrix.run == 'openrouteservice'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - name: Java 21 for OsmAnd (router helper is compiled on the runner)
        if: matrix.run == 'OsmAnd'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Run the three checks, one process each (logs kept as artifact, not printed)
        run: |
          set -uo pipefail
          status=0
          for test in closure damage badreq; do
            python -m benchmarks.run_d $test --engine ${{ matrix.run }} > results/rund/$test.log 2>&1 \
              || { echo "$test failed:"; tail -10 results/rund/$test.log; status=1; }
            echo "$test: $(wc -l < results/rund/$test.log) case lines"
          done
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rund-${{ matrix.run }}
          path: |
            results/rund/closure-*.json
            results/rund/damage-*.json
            results/rund/badreq-*.json
            results/rund/*.log
          retention-days: 30
  score:
    needs: [speed, engine]
    if: always() && needs.engine.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Collect results of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'rund-*' -D artifacts
          mkdir -p results/rund && cp artifacts/*/*.json results/rund/
      - name: Score and short summary
        run: |
          set -euo pipefail
          python -m benchmarks.run_d score
          python -m benchmarks.run_d brief | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rund-summary
          path: results/rund/summary.json
          retention-days: 90
