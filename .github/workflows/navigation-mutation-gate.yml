name: Hard holdout and mutation detection gate
on:
  push:
    branches: ['tests/harder-fault-detection-20261014']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutation-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Hard graph holdout and fault-detection controls
        run: |
          python -m unittest tests.test_navigation_mutation -v
          python -m benchmarks.navigation_mutation
          python -m tools.privacy_guard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-holdout-evidence
          path: results/navigation_mutation/report.json
          retention-days: 14
