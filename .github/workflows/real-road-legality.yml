name: DMN same-road map-rule legality comparison
on:
  push:
    branches: ['tests/real-road-legality-20261015']
    paths:
      - '.github/workflows/real-road-legality.yml'
      - 'benchmarks/real_road_legality.py'
      - 'benchmarks/real_english_speed.py'
      - 'benchmarks/expanded_comparison.py'
      - 'tests/test_real_road_legality.py'
permissions:
  contents: read
concurrency:
  group: real-road-legality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-road-legality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Review source, run regression and compile real-speed harness
        timeout-minutes: 6
        run: |
          python -m tools.privacy_guard
          bash navigation_core/native/build.sh
          python -m compileall -q benchmarks/real_english_speed.py benchmarks/real_road_legality.py
          python -m tools.unittest_evidence
      - name: Fetch dated public Greater Manchester road snapshot (never commit or publish PBF)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          mkdir -p results/real results/real-england/graphhopper
          BASE='https://download.geofabrik.de/europe/united-kingdom/england/greater-manchester-261013.osm.pbf'
          curl -fsSL --retry 2 --max-time 180 "$BASE" -o results/real/greater-manchester-261013.osm.pbf
          curl -fsSL --retry 2 --max-time 30 "$BASE.md5" -o results/real/greater-manchester-261013.osm.pbf.md5
          (cd results/real && md5sum -c greater-manchester-261013.osm.pbf.md5)
          sha256sum results/real/greater-manchester-261013.osm.pbf > results/real/source.sha256
          # Keep the exact original Wigan cohort; no area substitution.
          : > results/real-england/area-preflight.log
          selected=''
          while IFS='|' read -r place bbox; do
            test -n "$place" || continue
            echo "Trying real English roads: $place ($bbox)" | tee -a results/real-england/area-preflight.log
            if osmium extract --strategy complete_ways --bbox="$bbox" \
                   results/real/greater-manchester-261013.osm.pbf -o "results/real/$place-area.osm.pbf" &&
               osmium tags-filter "results/real/$place-area.osm.pbf" \
                   w/highway n/barrier r/type=restriction r/type=connectivity \
                   -o "results/real/$place-roads.osm.pbf" &&
               osmium cat "results/real/$place-roads.osm.pbf" \
                   -o "results/real/$place-roads.osm" -f osm,add_metadata=false &&
               test "$(stat -c%s "results/real/$place-roads.osm")" -lt 6000000 &&
               python -m benchmarks.real_english_speed \
                   --input "results/real/$place-roads.osm" \
                   --snapshot 2026-10-13 --cases 100 --preflight \
                   >> results/real-england/area-preflight.log 2>&1; then
              echo "$place: PASS" | tee -a results/real-england/area-preflight.log
              cp "results/real/$place-roads.osm.pbf" results/real/roads.osm.pbf
              cp "results/real/$place-roads.osm" results/real/roads.osm
              selected="$place"
              echo "ENGLAND_BBOX_NAME=$place" >> "$GITHUB_ENV"
              break
            else
              echo "$place: UNSUPPORTED (details in area-preflight.log)" | tee -a results/real-england/area-preflight.log
            fi
          done <<'AREAS'
          wigan|-2.641,53.522,-2.625,53.536
          AREAS
          if [ -z "$selected" ]; then
            echo 'No English road area passed strict map-import preflight'
            tail -100 results/real-england/area-preflight.log
            exit 2
          fi
          echo "Selected real-road area: $selected"
          echo '65f4326133144ea3fcac75cb4d670a0f23fb3a21792d1eca954bc8c286093a52  results/real/roads.osm' | sha256sum -c -
      - name: Fetch pinned GraphHopper and verify digest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 180 \
            https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar \
            -o "$RUNNER_TEMP/graphhopper.jar"
          echo 'fdc732882ada0c7464e8a25b5d0fe88c1467df5b0f918e6db20cbbac9753c8699b7266365dd52731a7b76db50c309e90d3e6ac0421af368778f85e966865825a  '"$RUNNER_TEMP/graphhopper.jar" | sha512sum -c -
      - name: Start OSRM MLD and CH on same public English road extract
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/project-osrm/osrm-backend:v5.27.1@sha256:855614a38f464b0558a2ad6eaa7cb8c139f39887da9b38b485ce453c6e6e6124'
          docker pull "$IMAGE"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/results/real:/data" "$IMAGE" osrm-extract -p /opt/car.lua /data/roads.osm.pbf
          mkdir -p results/real/ch
          cp results/real/roads.osrm* results/real/ch/
          docker run --rm -v "$PWD/results/real:/data" "$IMAGE" osrm-partition /data/roads.osrm
          docker run --rm -v "$PWD/results/real:/data" "$IMAGE" osrm-customize /data/roads.osrm
          docker run --rm -v "$PWD/results/real/ch:/data" "$IMAGE" osrm-contract /data/roads.osrm
          docker run -d --rm --name english-osrm-mld -p 127.0.0.1:5000:5000 \
            -v "$PWD/results/real:/data" "$IMAGE" osrm-routed --algorithm mld /data/roads.osrm
          docker run -d --rm --name english-osrm-ch -p 127.0.0.1:5001:5000 \
            -v "$PWD/results/real/ch:/data" "$IMAGE" osrm-routed --algorithm ch /data/roads.osrm
          for port in 5000 5001; do
            ready=0
            for attempt in $(seq 1 40); do
              if curl -fsS --max-time 2 "http://127.0.0.1:$port/nearest/v1/driving/-2.242,53.482" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" -eq 1 || { echo "OSRM port $port failed readiness"; exit 2; }
          done
      - name: Start pinned Valhalla on identical English OSM snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/real/valhalla
          cp results/real/roads.osm.pbf results/real/valhalla/roads.osm.pbf
          IMAGE='ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956'
          docker pull "$IMAGE"
          docker run -d --rm --name english-valhalla -p 127.0.0.1:8002:8002 \
            -v "$PWD/results/real/valhalla:/custom_files" \
            -e build_admins=False -e build_time_zones=False \
            -e build_elevation=False -e build_tar=False \
            -e server_threads=2 "$IMAGE"
          ready=0
          for attempt in $(seq 1 100); do
            if curl -fsS --max-time 2 http://127.0.0.1:8002/status > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1 || { echo 'Valhalla unavailable on this run; unranked'; exit 2; }
          echo 'Valhalla ready on the same map'
      - name: Compare returned paths against independent raw-OSM rule judge
        run: |
          set -euo pipefail
          python -m benchmarks.real_road_legality --input results/real/roads.osm --snapshot 2026-10-13 --graphhopper-jar "$RUNNER_TEMP/graphhopper.jar" --cases 100
      - name: Preserve category counts and all failures
        if: always()
        run: |
          mkdir -p results/legality
          if ! test -f results/legality/comparison.json; then
            python - <<'PYSETUP'
          import json
          from pathlib import Path
          engines=['drivemate-native-cpp','graphhopper','osrm-mld','osrm-ch','valhalla']
          x={'state':'INCOMPLETE_SETUP_OR_EXECUTION','planned_cases_per_engine':100,'planned_engine_case_rows':500,'planned_category_cells':3500,'missing_results_are_passes':False,'engines':engines,'overall_navigation_ranking':None}
          Path('results/legality/unavailable.json').write_text(json.dumps(x,indent=2)+'\n')
          print(json.dumps(x))
          PYSETUP
          fi
          if test -f results/legality/COMPARISON.md; then cat results/legality/COMPARISON.md >> "$GITHUB_STEP_SUMMARY"; fi
          if test -f results/legality/comparison.json; then
            python - <<'PYRESULT'
          import json
          x=json.load(open('results/legality/comparison.json'))
          print('LEGALITY_FAILURE_ROWS='+json.dumps([r for r in x['rows'] if any(v=='fail' for v in r['checks'].values())]))
          PYRESULT
          fi
      - name: Clean up services
        if: always()
        run: |
          mkdir -p results/legality
          docker logs --tail 60 english-valhalla > results/legality/valhalla.log 2>&1 || true
          docker logs --tail 40 english-osrm-mld > results/legality/osrm-mld.log 2>&1 || true
          docker logs --tail 40 english-osrm-ch > results/legality/osrm-ch.log 2>&1 || true
          docker rm -f english-osrm-mld english-osrm-ch english-valhalla || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-road-legality-evidence
          path: |
            results/legality/
            results/unittest/per_test.json
            results/real-england/preflight.json
            results/real-england/area-preflight.log
            results/real/source.sha256
          retention-days: 30
          if-no-files-found: error
