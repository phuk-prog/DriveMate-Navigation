name: MAP-001 v3 Manchester diagnosis and Valhalla graph facts
on:
  pull_request:
    paths:
      - 'tools/reference/valhalla_graph_probe.cc'
      - 'benchmarks/map001_native_reference.py'
      - 'benchmarks/map001_access_review.py'
      - 'map_data/osm_xml.py'
      - 'map_data/offline.py'
      - 'engine/routing.py'
      - 'engine/astar.py'
      - 'engine/route_alternatives.py'
      - 'benchmarks/map001_context_access.py'
      - 'tests/test_osm_import.py'
      - 'benchmarks/map001_direction_contract.py'
      - 'tests/test_map001_direction_contract.py'
      - 'benchmarks/map001_v3_restriction_diagnostics.py'
      - 'benchmarks/map001_valhalla_graph_facts.py'
      - 'tests/test_map001_v3_fact_extensions.py'
      - '.github/workflows/map001-v3-facts.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: map001-v3-facts
  cancel-in-progress: false
jobs:
  facts:
    if: contains(github.event.pull_request.title, '[map001-facts]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test Category 1 diagnosis and graph facts only
        run: |
          set -euo pipefail
          python -m tools.privacy_guard
          python -m tools.category_test_runner --category map_data --output-dir results/map001-unit-checks
      - name: Reuse exactly frozen Category 1 v3 source files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results
          gh run download 38945058272 --repo phuk-prog/DriveMate-Navigation -n map001-v3-frozen-osm-closure-and-valhalla -D results
          test -s results/map001-manchester.osm
          test -s results/map001-v3-manifest.json
      - name: Investigate Manchester cases on archived Manchester map
        run: |
          python -m benchmarks.map001_v3_restriction_diagnostics
          python -m benchmarks.map001_direction_contract
          python -m benchmarks.map001_context_access
      - name: Build bounded local Valhalla 3.9.1 reference graph
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq osmium-tool >/dev/null
          osmium cat results/map001-manchester.osm -o results/map001-facts.osm.pbf
          IMAGE='ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956'
          docker pull "$IMAGE"
          mkdir -p results/valhalla
          cp results/map001-facts.osm.pbf results/valhalla/
          docker run -d --rm --name map001-facts -p 127.0.0.1:8002:8002 -v "$PWD/results/valhalla:/custom_files" -e build_admins=False -e build_time_zones=False -e build_elevation=False -e build_tar=False -e server_threads=2 "$IMAGE"
          python - <<'PY'
          from benchmarks.valhalla_live_reference import wait_for_local_router
          wait_for_local_router(150)
          PY
          python -m benchmarks.map001_valhalla_graph_facts
          python -m benchmarks.map001_access_review
      - name: Compile read-only native graph probe against unchanged Valhalla installation
        timeout-minutes: 7
        run: |
          set -euo pipefail
          docker cp tools/reference/valhalla_graph_probe.cc map001-facts:/tmp/reference_probe.cc
          docker exec -u 0 map001-facts bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq g++ pkg-config libboost-dev libboost-filesystem-dev libboost-system-dev libboost-thread-dev libboost-date-time-dev libboost-regex-dev libboost-program-options-dev libprotobuf-dev libsqlite3-dev libcurl4-openssl-dev zlib1g-dev libzmq3-dev libczmq-dev libluajit-5.1-dev libgeotiff-dev liblz4-dev rapidjson-dev libspatialite-dev libgeos-dev libssl-dev >/dev/null
            pkg-config --modversion libvalhalla
            DMN_REFERENCE_FLAGS=$(pkg-config --cflags --libs libvalhalla spatialite sqlite3 luajit geos openssl libcurl libtiff-4 liblz4)
            c++ -std=c++20 -O2 /tmp/reference_probe.cc -o /tmp/reference_probe $DMN_REFERENCE_FLAGS -pthread
          '
          python - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          files=sorted(Path('results/valhalla').rglob('*.gph'))
          assert files, 'No native graph tiles'
          manifest={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          Path('results/map001-native-tile-hashes.json').write_text(json.dumps(manifest,sort_keys=True))
          PYCODE
          docker exec map001-facts /tmp/reference_probe /custom_files/valhalla.json > results/map001-valhalla-native.jsonl
          python - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          manifest=json.loads(Path('results/map001-native-tile-hashes.json').read_text())
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in manifest.items()), 'Reference graph changed during inspection'
          PYCODE
          python -m benchmarks.map001_native_reference
      - name: Gate approved directional fix on frozen cohort
        run: |
          python - <<'PYCODE'
          import json
          r=json.load(open('results/map001-direction-contract.json'))
          assert len(r['cases']) == 20, 'Frozen Manchester cohort incomplete'
          assert r['counts'].get('FAIL', 0) == 0, 'DMN source mismatch remains'
          assert r['runtime_changed'], 'Approved importer correction not present'
          v=json.load(open('results/map001-v3-valhalla-graph-facts.json'))
          assert v['source_sha256'] == r['source_sha256'], 'Engine input mismatch'
          assert v['cases_total'] == 20, 'Valhalla cohort incomplete'
          PYCODE
      - name: Publish small case-level evidence, not duplicate map files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: map001-v3-manchester-and-valhalla-graph-facts
          path: |
            results/map001-v3-manchester-diagnostics.json
            results/map001-direction-contract.json
            results/map001-contextual-access.json
            results/map001-unit-checks/
            results/map001-native-comparison.json
            results/map001-valhalla-native.jsonl
            results/map001-native-tile-hashes.json
            results/map001-access-applicability.json
            results/map001-valhalla-fresh-candidates.json
            results/map001-v3-valhalla-graph-facts.json
          if-no-files-found: warn
          retention-days: 30
      - name: Diagnostics on failed reference
        if: failure()
        run: docker logs map001-facts 2>/dev/null | tail -60 || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f map001-facts >/dev/null 2>&1 || true
          sudo rm -rf results/valhalla results/map001-facts.osm.pbf
