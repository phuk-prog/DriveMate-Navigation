name: Run B2 LANES-001 and LIMITS-001 (categories 10, 15), DMN with OSRM and GraphHopper
# Runs the frozen LANES-001 and LIMITS-001 cohorts in one GitHub run; each test is scored and
# summarised separately, never as one total. Only OSRM (lanes, limits) and GraphHopper
# (limits) expose these details; the other reference engines are reported NOT_AVAILABLE.
on:
  workflow_dispatch:
  # A new workflow can only be started by hand once it is on the default branch,
  # so a push that changes the test itself also runs it (research branches only).
  push:
    branches: ['claude/**', 'codex/**', 'ccr-**']
    paths:
      - 'benchmarks/b2_lanes_limits.py'
      - 'benchmarks/journey001.py'
      - 'benchmarks/access001_route.py'
      - 'benchmarks/extra_engines.py'
      - 'config/lanes001-*.json'
      - 'config/limits001-*.json'
      - '.github/workflows/b2-lanes-limits.yml'
      # an engine or importer change re-runs the whole test for every engine (owner rule 6)
      - 'engine/**'
      - 'map_data/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: b2-lanes-limits-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_JAR_URL: https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar
  GH_JAR_SHA1: 6e6c173c2b46cb0a3c1df124b2144d557931597e
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test: [lanes001, limits001]
        run: [DMN, OSRM, GraphHopper, TomTom]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned inputs (verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          raw=https://raw.githubusercontent.com/${{ github.repository }}
          mkdir -p results/turn001 results/${{ matrix.test }}
          (cd results/turn001 && curl -fsSL -o SHA256SUMS "$raw/data/turn001-snapshot/SHA256SUMS" \
            && curl -fsSL -o gm.osm.pbf "$raw/data/turn001-snapshot/gm.osm.pbf" && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Java and jar
        if: matrix.run == 'GraphHopper'
        run: |
          set -euo pipefail
          mkdir -p results/turn001/engines
          curl -fsSL -o results/turn001/engines/gh.jar "$GH_JAR_URL"
          echo "$GH_JAR_SHA1  results/turn001/engines/gh.jar" | sha1sum -c -
          sudo mkdir -p /opt/jdk17/bin && sudo ln -sf "$JAVA_HOME_17_X64/bin/java" /opt/jdk17/bin/java
      - name: Run ${{ matrix.run }} (log kept as artifact, not printed)
        env:
          # TomTom is a yardstick only (verdicts kept, nothing of its data stored)
          TOMTOM_KEY: ${{ matrix.run == 'TomTom' && secrets.TOMTOM_KEY || '' }}
        run: |
          if [ "${{ matrix.run }}" = TomTom ] && [ -z "$TOMTOM_KEY" ]; then
            echo "TomTom NOT_RUN: repository secret TOMTOM_KEY is not set" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          set -euo pipefail
          t=${{ matrix.test }}
          python -m benchmarks.b2_lanes_limits --test $t run --engine ${{ matrix.run }} > results/$t/run.log 2>&1 || { tail -20 results/$t/run.log; exit 1; }
          awk '{print $2, $3}' results/$t/run.log | sort | uniq -c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.test }}-${{ matrix.run }}
          path: |
            results/${{ matrix.test }}/run-*.json
            results/${{ matrix.test }}/run.log
          retention-days: 30
  score:
    needs: engine
    if: always() && needs.engine.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Collect engine results of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download ${{ github.run_id }} -R ${{ github.repository }} -D artifacts
          for t in lanes001 limits001; do
            mkdir -p results/$t && cp artifacts/$t-*/run-*.json results/$t/ 2>/dev/null || true
          done
      - name: Score and short summary
        run: |
          set -euo pipefail
          for t in lanes001 limits001; do
            python -m benchmarks.b2_lanes_limits --test $t score
            python -m benchmarks.b2_lanes_limits --test $t brief | tee -a "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b2-summary
          path: |
            results/lanes001/summary.json
            results/limits001/summary.json
          retention-days: 90
