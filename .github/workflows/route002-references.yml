name: ROUTE-002 expanded routing references
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: route002-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trial:
    if: contains(github.event.pull_request.title, '[route002-refs]') || contains(github.event.pull_request.title, '[route002-brouter]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        engine: ${{ contains(github.event.pull_request.title, '[route002-brouter]') && fromJSON('["BRouter"]') || fromJSON('["OSRM","Valhalla","GraphHopper","openrouteservice","BRouter"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify unchanged routing oracle and DMN
        run: |
          python -m tools.privacy_guard
          python -m unittest discover -s tests -q
          python -m benchmarks.routing_legality_batch --engine DMN --output results/route002-DMN.json
      - name: Prepare identical invented road topology
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq osmium-tool >/dev/null
          cp benchmarks/fixtures/synthetic-route-002.xml results/route002.osm
          osmium cat results/route002.osm -o results/route002.osm.pbf
      - name: OSRM 5.27.1
        if: matrix.engine == 'OSRM'
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/project-osrm/osrm-backend:v5.27.1@sha256:855614a38f464b0558a2ad6eaa7cb8c139f39887da9b38b485ce453c6e6e6124'
          docker pull "$IMAGE"
          docker run --rm -v "$PWD/results:/data" "$IMAGE" osrm-extract -p /opt/car.lua /data/route002.osm.pbf
          docker run --rm -v "$PWD/results:/data" "$IMAGE" osrm-partition /data/route002.osrm
          docker run --rm -v "$PWD/results:/data" "$IMAGE" osrm-customize /data/route002.osrm
          docker run -d --rm --name route002-reference -p 127.0.0.1:5000:5000 -v "$PWD/results:/data" "$IMAGE" osrm-routed --algorithm mld /data/route002.osrm
      - name: Valhalla 3.9.1
        if: matrix.engine == 'Valhalla'
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956'
          mkdir -p results/valhalla
          cp results/route002.osm.pbf results/valhalla/
          docker pull "$IMAGE"
          docker run -d --rm --name route002-reference -p 127.0.0.1:8002:8002 -v "$PWD/results/valhalla:/custom_files" -e build_admins=False -e build_time_zones=False -e build_elevation=False -e use_default_speeds_config=False -e build_tar=False -e server_threads=2 "$IMAGE"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        if: matrix.engine == 'GraphHopper' || matrix.engine == 'openrouteservice' || matrix.engine == 'BRouter'
        with:
          distribution: temurin
          java-version: ${{ matrix.engine == 'BRouter' && '17' || '25' }}
      - name: GraphHopper 11.1
        if: matrix.engine == 'GraphHopper'
        run: |
          set -euo pipefail
          BASE='https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar'
          curl -fsSL --retry 2 --max-time 180 "$BASE" -o "${RUNNER_TEMP}/graphhopper.jar"
          curl -fsSL --retry 2 --max-time 30 "$BASE.sha1" -o "${RUNNER_TEMP}/graphhopper.sha1"
          printf '%s  %s\n' "$(cat "${RUNNER_TEMP}/graphhopper.sha1")" "${RUNNER_TEMP}/graphhopper.jar" | sha1sum --check --status
          sed -e 's@results/public-graphhopper-subset.osm.pbf@results/route002.osm.pbf@' -e 's/prepare.min_network_size: 10/prepare.min_network_size: 0/' config/graphhopper-public-smoke.yml > results/graphhopper.yml
          java -Xms128m -Xmx1024m -jar "${RUNNER_TEMP}/graphhopper.jar" server results/graphhopper.yml > "${RUNNER_TEMP}/route002-graphhopper.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/route002-pid"
      - name: openrouteservice 10.1.0
        if: matrix.engine == 'openrouteservice'
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 180 https://github.com/GIScience/openrouteservice/releases/download/v10.1.0/ors.jar -o "${RUNNER_TEMP}/ors.jar"
          printf '%s  %s\n' '46b83b353eaf8830a1b53cad91d027e00547cd9a00e86efddd64a45335bfb8e1' "${RUNNER_TEMP}/ors.jar" | sha256sum --check
          sed 's@results/gps001.osm.pbf@results/route002.osm.pbf@' config/ors-gps001.yml > results/ors-route002.yml
          ORS_CONFIG_LOCATION="$PWD/results/ors-route002.yml" java -Xms128m -Xmx1536m -jar "${RUNNER_TEMP}/ors.jar" > "${RUNNER_TEMP}/route002-ors.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/route002-pid"
      - name: BRouter 1.7.10 map builder and local server
        if: matrix.engine == 'BRouter'
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 180 https://github.com/abrensch/brouter/releases/download/v1.7.10/brouter-1.7.10.zip -o "${RUNNER_TEMP}/brouter.zip"
          printf '%s  %s\n' '023fec3ba997758e8cd7ab9e1bae52e962af3f00b57683e3de86b84ffad01532' "${RUNNER_TEMP}/brouter.zip" | sha256sum --check
          unzip -q "${RUNNER_TEMP}/brouter.zip" -d results/brouter-release
          python - <<'PYCODE'
          from pathlib import Path
          import shutil
          root=Path('results/brouter-release')
          jars=list(root.rglob('brouter-*-all.jar')); profiles=list(root.rglob('profiles2'))
          assert len(jars)==len(profiles)==1
          shutil.copyfile(jars[0],'results/brouter.jar');shutil.copytree(profiles[0],'results/brouter-profiles')
          PYCODE
          for PROFILE in all softaccess; do
            curl -fsSL --retry 2 --max-time 30 "https://raw.githubusercontent.com/abrensch/brouter/4d2639af77ea5ed9c30d3e400764eb6f9e8522da/misc/profiles2/${PROFILE}.brf" -o "results/brouter-profiles/${PROFILE}.brf"
          done
          sha256sum results/brouter.jar results/brouter-profiles/*.brf results/brouter-profiles/lookups.dat > results/route002-brouter-input-hashes.txt
          cat results/route002-brouter-input-hashes.txt
          mkdir -p results/brouter-build/{nodetiles,waytiles,nodes55,waytiles55,unodes55,segments,elevation,customprofiles}
          cd results/brouter-build
          java -Xmx512m -DavoidMapPolling=true -cp ../brouter.jar btools.mapcreator.OsmFastCutter ../brouter-profiles/lookups.dat nodetiles waytiles nodes55 waytiles55 bordernids.dat relations.dat restrictions.dat ../brouter-profiles/all.brf ../brouter-profiles/trekking.brf ../brouter-profiles/softaccess.brf ../route002.osm.pbf
          java -Xmx512m -cp ../brouter.jar btools.mapcreator.PosUnifier nodes55 unodes55 bordernids.dat bordernodes.dat elevation
          java -Xmx512m -cp ../brouter.jar btools.mapcreator.WayLinker unodes55 waytiles55 bordernodes.dat restrictions.dat ../brouter-profiles/lookups.dat ../brouter-profiles/all.brf segments rd5
          test -n "$(find segments -name '*.rd5' -print -quit)"
          sha256sum segments/*.rd5 > ../route002-brouter-segment-hashes.txt
          cat ../route002-brouter-segment-hashes.txt
          cd ../..
          java -Xmx512m -DmaxRunningTime=30 -cp results/brouter.jar btools.server.RouteServer results/brouter-build/segments results/brouter-profiles results/brouter-build/customprofiles 17777 1 127.0.0.1 > "${RUNNER_TEMP}/route002-brouter.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/route002-pid"
      - name: Execute actual engine against frozen legality and rerouting cases
        env:
          TRIAL_ENGINE: ${{ matrix.engine }}
        run: python -m benchmarks.routing_legality_batch --engine "$TRIAL_ENGINE" --output "results/route002-${TRIAL_ENGINE}.json"
      - name: Diagnostic scorecard including all twelve references
        env:
          TRIAL_ENGINE: ${{ matrix.engine }}
        run: python -m benchmarks.routing_legality_batch --reports results/route002-DMN.json "results/route002-${TRIAL_ENGINE}.json" --output "results/route002-scorecard-${TRIAL_ENGINE}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: route002-${{ matrix.engine }}
          path: |
            results/route002-*.json
            results/route002-*-hashes.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Diagnostic startup logs
        if: failure()
        run: |
          if [ -f "${RUNNER_TEMP}/route002-graphhopper.log" ]; then tail -80 "${RUNNER_TEMP}/route002-graphhopper.log"; fi
          if [ -f "${RUNNER_TEMP}/route002-ors.log" ]; then tail -80 "${RUNNER_TEMP}/route002-ors.log"; fi
          if [ -f "${RUNNER_TEMP}/route002-brouter.log" ]; then tail -80 "${RUNNER_TEMP}/route002-brouter.log"; fi
          docker logs route002-reference 2>/dev/null | tail -80 || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f route002-reference >/dev/null 2>&1 || true
          if [ -f "${RUNNER_TEMP}/route002-pid" ]; then kill "$(cat "${RUNNER_TEMP}/route002-pid")" 2>/dev/null || true; fi
          sudo rm -rf results/valhalla results/graphhopper-cache results/ors-graphs results/brouter-build results/brouter-release results/brouter-profiles
