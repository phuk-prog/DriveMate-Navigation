name: Navigation category comparison
on:
  push:
    branches: ['benchmarks/navigation-comparison-20261014']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navigation-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate-and-graphhopper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Source privacy and independent regression
        run: |
          python -m tools.privacy_guard
          bash navigation_core/native/build.sh
          python -m compileall -q engine gps guidance navigation_core map_data benchmarks tools tests
          python -m tools.unittest_evidence
          python -m benchmarks.navigation_mutation
          python -m tools.run_navigation_categories
      - name: Isolated pinned GraphHopper reference
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 180 https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar -o "$RUNNER_TEMP/graphhopper.jar"
          echo "fdc732882ada0c7464e8a25b5d0fe88c1467df5b0f918e6db20cbbac9753c8699b7266365dd52731a7b76db50c309e90d3e6ac0421af368778f85e966865825a  $RUNNER_TEMP/graphhopper.jar" | sha512sum -c -
          python -m benchmarks.whole_drive_reference --jar "$RUNNER_TEMP/graphhopper.jar"
          python -m benchmarks.category_scorecard --jar "$RUNNER_TEMP/graphhopper.jar" --repeats 30
          python -m benchmarks.ten_system_matrix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-graphhopper-evidence
          path: |
            results/**/*.json
            results/**/*.csv
            results/**/*.log
            results/**/*.xml
            results/**/*.osm
            !results/**/cache/**
          retention-days: 14
  isolated-references:
    needs: candidate-and-graphhopper
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        engine: [osrm, valhalla]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare identical authored map only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          mkdir -p results/shared
          bash navigation_core/native/build.sh
          python -m benchmarks.whole_drive
          python -c "from pathlib import Path; from benchmarks.whole_drive import fixture; Path('results/shared/synthetic.osm').write_bytes(fixture())"
          osmium cat results/shared/synthetic.osm -o results/shared/synthetic.osm.pbf
      - name: OSRM pinned MLD reference
        if: matrix.engine == 'osrm'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/project-osrm/osrm-backend:v5.27.1@sha256:855614a38f464b0558a2ad6eaa7cb8c139f39887da9b38b485ce453c6e6e6124"
          docker pull "$IMAGE"
          docker run --rm -v "$PWD/results/shared:/data" "$IMAGE" osrm-extract -p /opt/car.lua /data/synthetic.osm.pbf
          docker run --rm -v "$PWD/results/shared:/data" "$IMAGE" osrm-partition /data/synthetic.osrm
          docker run --rm -v "$PWD/results/shared:/data" "$IMAGE" osrm-customize /data/synthetic.osrm
          docker run -d --rm --name reference -p 127.0.0.1:5000:5000 -v "$PWD/results/shared:/data" "$IMAGE" osrm-routed --algorithm mld /data/synthetic.osrm
          python -m benchmarks.cloud_reference --engine osrm --version 5.27.1
      - name: OSRM CH alternative reference on identical authored map
        if: matrix.engine == 'osrm'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/project-osrm/osrm-backend:v5.27.1@sha256:855614a38f464b0558a2ad6eaa7cb8c139f39887da9b38b485ce453c6e6e6124"
          mkdir -p results/shared/ch
          cp results/shared/synthetic.osm.pbf results/shared/ch/synthetic.osm.pbf
          docker run --rm -v "$PWD/results/shared:/data" "$IMAGE" osrm-extract -p /opt/car.lua /data/ch/synthetic.osm.pbf
          docker run --rm -v "$PWD/results/shared:/data" "$IMAGE" osrm-contract /data/ch/synthetic.osrm
          docker run -d --rm --name reference-ch -p 127.0.0.1:5001:5000 -v "$PWD/results/shared:/data" "$IMAGE" osrm-routed --algorithm ch /data/ch/synthetic.osrm
          python -m benchmarks.cloud_reference --engine osrm-ch --version 5.27.1
      - name: Valhalla pinned reference
        if: matrix.engine == 'valhalla'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956"
          docker pull "$IMAGE"
          docker run -d --rm --name reference -p 127.0.0.1:8002:8002 -v "$PWD/results/shared:/custom_files" -e build_admins=False -e build_time_zones=False -e build_elevation=False -e use_default_speeds_config=False -e build_tar=False -e server_threads=2 "$IMAGE"
          python -m benchmarks.cloud_reference --engine valhalla --version 3.9.1
      - name: Capture diagnostics and remove isolated runtime
        if: always()
        run: |
          docker logs --tail 60 reference > results/reference-startup.log 2>&1 || true
          docker logs --tail 60 reference-ch > results/reference-ch-startup.log 2>&1 || true
          docker rm -f reference || true
          docker rm -f reference-ch || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.engine }}-evidence
          path: |
            results/cloud_*/*.json
            results/reference-startup.log
            results/reference-ch-startup.log
          retention-days: 14


  routingkit-reference:
    needs: candidate-and-graphhopper
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile external pinned RoutingKit CH
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/RoutingKit/RoutingKit.git "$RUNNER_TEMP/RoutingKit"
          git -C "$RUNNER_TEMP/RoutingKit" checkout 54d49bb0cdea56dde182357522e4e86a03c57852
          test "$(git -C "$RUNNER_TEMP/RoutingKit" rev-parse HEAD)" = 54d49bb0cdea56dde182357522e4e86a03c57852
          make -C "$RUNNER_TEMP/RoutingKit" -j2 lib/libroutingkit.a
          g++ -std=c++17 -O2 -I"$RUNNER_TEMP/RoutingKit/include" benchmarks/routingkit_ch_adapter.cpp "$RUNNER_TEMP/RoutingKit/lib/libroutingkit.a" -fopenmp -pthread -o "$RUNNER_TEMP/routingkit_fixture"
      - name: Actual reference routing computations
        run: |
          python -m unittest tests.test_routingkit_reference -v
          python -m benchmarks.routingkit_reference --binary "$RUNNER_TEMP/routingkit_fixture" --revision 54d49bb0cdea56dde182357522e4e86a03c57852
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: routingkit-evidence
          path: results/routingkit/comparison.json
          retention-days: 14
  pgrouting-reference:
    needs: candidate-and-graphhopper
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Start isolated pgRouting
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='pgrouting/pgrouting:16-3.5-3.7.3'
          docker pull "$IMAGE"
          docker run -d --rm --name dm-pgrouting-reference -e POSTGRES_PASSWORD=synthetic-test-local-only "$IMAGE"
          for i in $(seq 1 60); do
            if docker exec dm-pgrouting-reference pg_isready -U postgres -d postgres | grep -q 'accepting connections'; then break; fi
            sleep 1
          done
          docker exec dm-pgrouting-reference pg_isready -U postgres -d postgres
      - name: Actual independent PostgreSQL route computation
        run: |
          python -m unittest tests.test_pgrouting_reference -v
          python -m benchmarks.pgrouting_reference --image 'pgrouting/pgrouting:16-3.5-3.7.3'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pgrouting-evidence
          path: results/pgrouting/comparison.json
          retention-days: 14
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker rm -f dm-pgrouting-reference || true

  category-report:
    if: always()
    needs: [candidate-and-graphhopper, isolated-references, routingkit-reference, pgrouting-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: collected
      - run: python3 -m benchmarks.cloud_report --input collected
      - name: Publish complete category and failure scorecard
        run: |
          cat results/ci-report/SCORECARD.md >> "$GITHUB_STEP_SUMMARY"
          test -s results/ci-report/category_results.json
          test -s results/ci-report/CATEGORY_SCORECARD.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: category-scorecard
          path: results/ci-report
          retention-days: 14
