name: DriveMate Navigation research checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests and synthetic benchmark only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: ''
      - name: Reject personal data and credentials in public repository
        run: python -m tools.privacy_guard
      - name: Compile source
        run: python -m compileall -q engine map_data benchmarks tools tests
      - name: Run independent routing tests
        run: python -m unittest discover -s tests -v
      - name: Measure synthetic routing latency (informational only)
        run: |
          python -m benchmarks.run --repeat 30
          python -m benchmarks.search_comparison --size 14 --repeat 5
      - name: Public UK road import and dual-engine smoke (explicit marker only)
        if: contains(github.event.head_commit.message, '[uk-road-smoke]')
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq osmium-tool >/dev/null
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 180 \
            --output "${RUNNER_TEMP}/greater-manchester-260901.osm.pbf" \
            "https://download.geofabrik.de/europe/united-kingdom/england/greater-manchester-260901.osm.pbf"
          python -m tools.public_osm_extract \
            --input "${RUNNER_TEMP}/greater-manchester-260901.osm.pbf" \
            --bbox=-2.270000,53.350000,-2.260000,53.360000 \
            --snapshot "geofabrik-260901" \
            --region "independent public UK test area" --execute
          python -m benchmarks.public_uk_probe --input results/public-road-subset.osm \
            --snapshot "geofabrik-260901" --samples 8
      - name: OSRM MLD public reference smoke (single explicit run only)
        if: contains(github.event.head_commit.message, '[osrm-reference-smoke]')
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq osmium-tool >/dev/null
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 180 \
            --output "${RUNNER_TEMP}/public-greater-manchester.osm.pbf" \
            "https://download.geofabrik.de/europe/united-kingdom/england/greater-manchester-260901.osm.pbf"
          osmium extract --strategy complete_ways --bbox=-2.270000,53.350000,-2.260000,53.360000 \
            "${RUNNER_TEMP}/public-greater-manchester.osm.pbf" -o results/osrm-public-subset.osm.pbf
          osmium cat results/osrm-public-subset.osm.pbf -o results/public-road-subset.osm \
            -f osm,add_metadata=false
          python -m map_data --input results/public-road-subset.osm \
            --region "independent public UK test area" --snapshot "geofabrik-260901"
          IMAGE="ghcr.io/project-osrm/osrm-backend:v5.27.1@sha256:855614a38f464b0558a2ad6eaa7cb8c139f39887da9b38b485ce453c6e6e6124"
          docker pull "$IMAGE"
          docker run --rm -v "$PWD/results:/data" "$IMAGE" osrm-extract \
            -p /opt/car.lua /data/osrm-public-subset.osm.pbf
          docker run --rm -v "$PWD/results:/data" "$IMAGE" osrm-partition \
            /data/osrm-public-subset.osrm
          docker run --rm -v "$PWD/results:/data" "$IMAGE" osrm-customize \
            /data/osrm-public-subset.osrm
          docker run -d --rm --name drivemate-nav-osrm-reference \
            -p 127.0.0.1:5000:5000 -v "$PWD/results:/data" "$IMAGE" \
            osrm-routed --algorithm mld /data/osrm-public-subset.osrm
          python -m benchmarks.osrm_live_reference --input results/public-road-subset.osm \
            --snapshot "geofabrik-260901" --samples 8 --repeats 5
      - name: Valhalla 3.9.1 public UK routing smoke (explicit once only)
        if: contains(github.event.head_commit.message, '[valhalla-reference-smoke]')
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq osmium-tool >/dev/null
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 180 \
            --output "${RUNNER_TEMP}/public-uk-source.osm.pbf" \
            "https://download.geofabrik.de/europe/united-kingdom/england/greater-manchester-260901.osm.pbf"
          osmium extract --strategy complete_ways --bbox=-2.270000,53.350000,-2.260000,53.360000 \
            "${RUNNER_TEMP}/public-uk-source.osm.pbf" \
            -o results/public-valhalla-subset.osm.pbf
          osmium cat results/public-valhalla-subset.osm.pbf -o results/public-road-subset.osm \
            -f osm,add_metadata=false
          python -m map_data --input results/public-road-subset.osm \
            --region "independent public UK test area" --snapshot "geofabrik-260901"
          IMAGE="ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956"
          docker pull "$IMAGE"
          mkdir -p results/valhalla-volume
          cp results/public-valhalla-subset.osm.pbf results/valhalla-volume/
          docker run -d --rm --name drivemate-nav-valhalla-reference \
            -p 127.0.0.1:8002:8002 \
            -v "$PWD/results/valhalla-volume:/custom_files" \
            -e build_admins=False -e build_time_zones=False \
            -e build_elevation=False -e use_default_speeds_config=False \
            -e build_tar=False -e server_threads=2 \
            "$IMAGE"
          if ! python -m benchmarks.valhalla_live_reference --input results/public-road-subset.osm \
            --snapshot geofabrik-260901 --samples 8 --repeats 5; then
            echo "Valhalla live request failed; sanitized startup diagnostics:"
            docker inspect --format 'State={{.State.Status}} ExitCode={{.State.ExitCode}} OOM={{.State.OOMKilled}}' drivemate-nav-valhalla-reference || true
            docker logs --tail 35 drivemate-nav-valhalla-reference 2>&1 |
              sed -E 's/(-?[0-9]{1,3}\.[0-9]{4,})/[public-coordinate-redacted]/g' |
              tail -n 35 || true
            exit 1
          fi
      - name: Remove Valhalla reference container and ephemeral public maps
        if: always()
        shell: bash
        run: |
          docker rm -f drivemate-nav-valhalla-reference >/dev/null 2>&1 || true
          rm -f "${RUNNER_TEMP}/public-uk-source.osm.pbf"
          rm -f results/public-valhalla-subset.osm.pbf
          rm -rf results/valhalla-volume
      - name: Clean up local OSRM and ephemeral public datasets
        if: always()
        shell: bash
        run: |
          docker rm -f drivemate-nav-osrm-reference 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/public-greater-manchester.osm.pbf"
          find results -maxdepth 1 -type f \( -name 'osrm-public-*' -o -name 'public-road-subset.osm' \) -delete 2>/dev/null || true
      - name: Remove downloaded public road extract and temporary road graph
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/greater-manchester-260901.osm.pbf"
          rm -f results/public-road-subset.osm
      - name: Verify opt-in public-road extraction CLI without using a real map
        run: python -m tools.public_osm_extract --help >/dev/null
