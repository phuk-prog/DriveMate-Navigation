name: ACCESS-001 four-engine no-car road route check
# Runs the frozen ACCESS-001 cohort on GitHub (public repo: free minutes). Engines run
# in parallel; one short summary is written to the job page. The source map is pinned on
# data/turn001-snapshot; each job cuts the 5 km clips from it and every clip must match
# its frozen hash in config/access001-prepared.json (osmium-tool 1.16, Ubuntu 24.04).
on:
  workflow_dispatch:
  # A new workflow can only be started by hand once it is on the default branch,
  # so a push that changes the test itself also runs it (research branches only).
  push:
    branches: ['claude/**', 'codex/**', 'ccr-**']
    paths:
      - 'benchmarks/access001_route.py'
      - 'config/access001-*.json'
      - '.github/workflows/access001.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: access001-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_JAR_URL: https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar
  GH_JAR_SHA1: 6e6c173c2b46cb0a3c1df124b2144d557931597e
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        run: [DMN, OSRM, GraphHopper, Valhalla, OSRM-control]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned inputs (verified)
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          raw=https://raw.githubusercontent.com/${{ github.repository }}
          mkdir -p results/turn001 results/access001
          (cd results/turn001 && curl -fsSL -o SHA256SUMS "$raw/data/turn001-snapshot/SHA256SUMS" \
            && curl -fsSL -o gm.osm.pbf "$raw/data/turn001-snapshot/gm.osm.pbf" && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Java and jar
        if: matrix.run == 'GraphHopper'
        run: |
          set -euo pipefail
          mkdir -p results/turn001/engines
          curl -fsSL -o results/turn001/engines/gh.jar "$GH_JAR_URL"
          echo "$GH_JAR_SHA1  results/turn001/engines/gh.jar" | sha1sum -c -
          sudo mkdir -p /opt/jdk17/bin && sudo ln -sf "$JAVA_HOME_17_X64/bin/java" /opt/jdk17/bin/java
      - name: Run ${{ matrix.run }} (log kept as artifact, not printed)
        run: |
          set -euo pipefail
          engine=${{ matrix.run }}; extra=
          if [ "$engine" = OSRM-control ]; then engine=OSRM; extra=--control; fi
          python -m benchmarks.access001_route run --engine "$engine" $extra > results/access001/run.log 2>&1 || { tail -20 results/access001/run.log; exit 1; }
          awk '{print $2}' results/access001/run.log | sort | uniq -c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: access001-${{ matrix.run }}
          path: |
            results/access001/run-*.json
            results/access001/run.log
          retention-days: 30
  score:
    needs: engine
    if: always() && needs.engine.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Collect engine results of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download ${{ github.run_id }} -R ${{ github.repository }} -p 'access001-*' -D artifacts
          mkdir -p results/access001 && cp artifacts/*/run-*.json results/access001/
      - name: Score and short summary
        run: |
          set -euo pipefail
          python -m benchmarks.access001_route score > /dev/null
          python -m benchmarks.access001_route brief | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: access001-summary
          path: results/access001/summary.json
          retention-days: 90
