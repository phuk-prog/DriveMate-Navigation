name: Real England road speed benchmark
on:
  push:
    branches: ['benchmarks/real-england-speed-20261014']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-england-speed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-road-speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Review source, run regression and compile real-speed harness
        run: |
          python -m tools.privacy_guard
          python -m compileall -q benchmarks/real_english_speed.py
          python -m tools.unittest_evidence
      - name: Fetch dated public Greater Manchester road snapshot (never commit or publish PBF)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          mkdir -p results/real results/real-england/graphhopper
          BASE='https://download.geofabrik.de/europe/united-kingdom/england/greater-manchester-261013.osm.pbf'
          curl -fsSL --retry 2 --max-time 180 "$BASE" -o results/real/greater-manchester-261013.osm.pbf
          curl -fsSL --retry 2 --max-time 30 "$BASE.md5" -o results/real/greater-manchester-261013.osm.pbf.md5
          (cd results/real && md5sum -c greater-manchester-261013.osm.pbf.md5)
          sha256sum results/real/greater-manchester-261013.osm.pbf > results/real/source.sha256
          osmium extract --strategy complete_ways --bbox=-2.252,53.477,-2.234,53.488 \
            results/real/greater-manchester-261013.osm.pbf -o results/real/roads.osm.pbf
          osmium cat results/real/roads.osm.pbf -o results/real/roads.osm -f osm,add_metadata=false
          test "$(stat -c%s results/real/roads.osm)" -lt 6000000
      - name: Fetch pinned GraphHopper and verify digest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 180 \
            https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar \
            -o "$RUNNER_TEMP/graphhopper.jar"
          echo 'fdc732882ada0c7464e8a25b5d0fe88c1467df5b0f918e6db20cbbac9753c8699b7266365dd52731a7b76db50c309e90d3e6ac0421af368778f85e966865825a  '"$RUNNER_TEMP/graphhopper.jar" | sha512sum -c -
      - name: Start OSRM MLD and CH on same public English road extract
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/project-osrm/osrm-backend:v5.27.1@sha256:855614a38f464b0558a2ad6eaa7cb8c139f39887da9b38b485ce453c6e6e6124'
          docker pull "$IMAGE"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/results/real:/data" "$IMAGE" osrm-extract -p /opt/car.lua /data/roads.osm.pbf
          mkdir -p results/real/ch
          cp results/real/roads.osrm* results/real/ch/
          docker run --rm -v "$PWD/results/real:/data" "$IMAGE" osrm-partition /data/roads.osrm
          docker run --rm -v "$PWD/results/real:/data" "$IMAGE" osrm-customize /data/roads.osrm
          docker run --rm -v "$PWD/results/real/ch:/data" "$IMAGE" osrm-contract /data/roads.osrm
          docker run -d --rm --name english-osrm-mld -p 127.0.0.1:5000:5000 \
            -v "$PWD/results/real:/data" "$IMAGE" osrm-routed --algorithm mld /data/roads.osrm
          docker run -d --rm --name english-osrm-ch -p 127.0.0.1:5001:5000 \
            -v "$PWD/results/real/ch:/data" "$IMAGE" osrm-routed --algorithm ch /data/roads.osrm
      - name: Measure real-English-road routes on same runner
        run: |
          python -m benchmarks.real_english_speed \
            --input results/real/roads.osm \
            --snapshot 2026-10-13 \
            --graphhopper-jar "$RUNNER_TEMP/graphhopper.jar" \
            --cases 16 --repeat 20 --osrm
      - name: Clean up reference services
        if: always()
        run: |
          docker logs --tail 40 english-osrm-mld > results/real-england/osrm-mld.log 2>&1 || true
          docker logs --tail 40 english-osrm-ch > results/real-england/osrm-ch.log 2>&1 || true
          docker rm -f english-osrm-mld english-osrm-ch || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-england-speed-evidence
          path: |
            results/real-england/speed.json
            results/real-england/*.log
            results/real/source.sha256
          retention-days: 14
