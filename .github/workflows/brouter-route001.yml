name: ROUTE-001 actual BRouter reference
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: brouter-route001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trial:
    if: contains(github.event.pull_request.title, '[brouter-route001]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify frozen analytical cases and execute DMN
        run: |
          python -m tools.privacy_guard
          python -m unittest discover -s tests -q
          python -m benchmarks.routing_trial --engine DMN --output results/route001-DMN.json
      - name: Prepare integrity-checked BRouter 1.7.10
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq osmium-tool >/dev/null
          curl -fsSL --retry 2 --max-time 180 https://github.com/abrensch/brouter/releases/download/v1.7.10/brouter-1.7.10.zip -o "${RUNNER_TEMP}/brouter.zip"
          printf '%s  %s\n' '023fec3ba997758e8cd7ab9e1bae52e962af3f00b57683e3de86b84ffad01532' "${RUNNER_TEMP}/brouter.zip" | sha256sum --check
          unzip -q "${RUNNER_TEMP}/brouter.zip" -d results/brouter-release
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('results/brouter-release')
          jars=list(root.rglob('brouter-*-all.jar'))
          assert len(jars)==1, 'Official full JAR missing; unavailable, not passed'
          shutil.copyfile(jars[0],'results/brouter.jar')
          profiles=list(root.rglob('profiles2'))
          assert len(profiles)==1, 'Official profiles missing'
          shutil.copytree(profiles[0],'results/brouter-profiles')
          PY
          for PROFILE in all softaccess; do
            curl -fsSL --retry 2 --max-time 30 "https://raw.githubusercontent.com/abrensch/brouter/4d2639af77ea5ed9c30d3e400764eb6f9e8522da/misc/profiles2/${PROFILE}.brf" -o "results/brouter-profiles/${PROFILE}.brf"
          done
          sha256sum results/brouter.jar results/brouter-profiles/*.brf results/brouter-profiles/lookups.dat > results/route001-brouter-input-hashes.txt
          cat results/route001-brouter-input-hashes.txt
          osmium cat benchmarks/fixtures/synthetic-route-001.xml -o results/route001.osm.pbf
      - name: Build segments from the identical invented road map
        run: |
          set -euo pipefail
          mkdir -p results/brouter-build/{nodetiles,waytiles,nodes55,waytiles55,unodes55,segments,elevation,customprofiles}
          cd results/brouter-build
          java -Xmx512m -DavoidMapPolling=true -cp ../brouter.jar btools.mapcreator.OsmFastCutter ../brouter-profiles/lookups.dat nodetiles waytiles nodes55 waytiles55 bordernids.dat relations.dat restrictions.dat ../brouter-profiles/all.brf ../brouter-profiles/trekking.brf ../brouter-profiles/softaccess.brf ../route001.osm.pbf
          java -Xmx512m -cp ../brouter.jar btools.mapcreator.PosUnifier nodes55 unodes55 bordernids.dat bordernodes.dat elevation
          java -Xmx512m -cp ../brouter.jar btools.mapcreator.WayLinker unodes55 waytiles55 bordernodes.dat restrictions.dat ../brouter-profiles/lookups.dat ../brouter-profiles/all.brf segments rd5
          test -n "$(find segments -name '*.rd5' -print -quit)"
          sha256sum segments/*.rd5 > ../route001-brouter-segment-hashes.txt
          cat ../route001-brouter-segment-hashes.txt
      - name: Start local router and execute four actual routes
        run: |
          set -euo pipefail
          java -Xmx512m -DmaxRunningTime=30 -cp results/brouter.jar btools.server.RouteServer results/brouter-build/segments results/brouter-profiles results/brouter-build/customprofiles 17777 1 127.0.0.1 > "${RUNNER_TEMP}/brouter-route001.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/brouter-route001.pid"
          python - <<'PY'
          import socket,time
          for _ in range(60):
              try:
                  with socket.create_connection(('127.0.0.1',17777),timeout=1): break
              except OSError: time.sleep(.5)
          else: raise SystemExit('BRouter unavailable; no scored execution')
          PY
          python -m benchmarks.routing_trial --engine BRouter --output results/route001-BRouter.json
          python -m benchmarks.routing_trial --reports results/route001-DMN.json results/route001-BRouter.json --output results/route001-scorecard.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: route001-brouter-evidence
          path: |
            results/route001-*.json
            results/route001-*-hashes.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Diagnostic failure log
        if: failure()
        run: tail -80 "${RUNNER_TEMP}/brouter-route001.log" || true
      - name: Cleanup
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/brouter-route001.pid" ]; then kill "$(cat "${RUNNER_TEMP}/brouter-route001.pid")" 2>/dev/null || true; fi
          rm -rf results/brouter-release results/brouter-profiles results/brouter-build
          rm -f results/brouter.jar results/route001.osm.pbf "${RUNNER_TEMP}/brouter.zip"
