name: ROUTE-001 expanded routing references
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: route001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trial:
    if: contains(github.event.pull_request.title, '[route001-refs]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        engine: [OSRM, Valhalla, GraphHopper, openrouteservice]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify unchanged routing oracle and DMN
        run: |
          python -m tools.privacy_guard
          python -m unittest discover -s tests -q
          python -m benchmarks.routing_trial --engine DMN --output results/route001-DMN.json
      - name: Prepare identical invented road topology
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq osmium-tool >/dev/null
          cp benchmarks/fixtures/synthetic-route-001.xml results/route001.osm
          osmium cat results/route001.osm -o results/route001.osm.pbf
      - name: OSRM 5.27.1
        if: matrix.engine == 'OSRM'
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/project-osrm/osrm-backend:v5.27.1@sha256:855614a38f464b0558a2ad6eaa7cb8c139f39887da9b38b485ce453c6e6e6124'
          docker pull "$IMAGE"
          docker run --rm -v "$PWD/results:/data" "$IMAGE" osrm-extract -p /opt/car.lua /data/route001.osm.pbf
          docker run --rm -v "$PWD/results:/data" "$IMAGE" osrm-partition /data/route001.osrm
          docker run --rm -v "$PWD/results:/data" "$IMAGE" osrm-customize /data/route001.osrm
          docker run -d --rm --name route001-reference -p 127.0.0.1:5000:5000 -v "$PWD/results:/data" "$IMAGE" osrm-routed --algorithm mld /data/route001.osrm
      - name: Valhalla 3.9.1
        if: matrix.engine == 'Valhalla'
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956'
          mkdir -p results/valhalla
          cp results/route001.osm.pbf results/valhalla/
          docker pull "$IMAGE"
          docker run -d --rm --name route001-reference -p 127.0.0.1:8002:8002 -v "$PWD/results/valhalla:/custom_files" -e build_admins=False -e build_time_zones=False -e build_elevation=False -e use_default_speeds_config=False -e build_tar=False -e server_threads=2 "$IMAGE"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        if: matrix.engine == 'GraphHopper' || matrix.engine == 'openrouteservice'
        with:
          distribution: temurin
          java-version: '25'
      - name: GraphHopper 11.1
        if: matrix.engine == 'GraphHopper'
        run: |
          set -euo pipefail
          BASE='https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.1/graphhopper-web-11.1.jar'
          curl -fsSL --retry 2 --max-time 180 "$BASE" -o "${RUNNER_TEMP}/graphhopper.jar"
          curl -fsSL --retry 2 --max-time 30 "$BASE.sha1" -o "${RUNNER_TEMP}/graphhopper.sha1"
          printf '%s  %s\n' "$(cat "${RUNNER_TEMP}/graphhopper.sha1")" "${RUNNER_TEMP}/graphhopper.jar" | sha1sum --check --status
          sed -e 's@results/public-graphhopper-subset.osm.pbf@results/route001.osm.pbf@' -e 's/prepare.min_network_size: 10/prepare.min_network_size: 0/' config/graphhopper-public-smoke.yml > results/graphhopper.yml
          java -Xms128m -Xmx1024m -jar "${RUNNER_TEMP}/graphhopper.jar" server results/graphhopper.yml > "${RUNNER_TEMP}/route001-graphhopper.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/route001-pid"
      - name: openrouteservice 10.1.0
        if: matrix.engine == 'openrouteservice'
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 180 https://github.com/GIScience/openrouteservice/releases/download/v10.1.0/ors.jar -o "${RUNNER_TEMP}/ors.jar"
          printf '%s  %s\n' '46b83b353eaf8830a1b53cad91d027e00547cd9a00e86efddd64a45335bfb8e1' "${RUNNER_TEMP}/ors.jar" | sha256sum --check
          sed 's@results/gps001.osm.pbf@results/route001.osm.pbf@' config/ors-gps001.yml > results/ors-route001.yml
          ORS_CONFIG_LOCATION="$PWD/results/ors-route001.yml" java -Xms128m -Xmx1536m -jar "${RUNNER_TEMP}/ors.jar" > "${RUNNER_TEMP}/route001-ors.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/route001-pid"
      - name: Execute actual engine against four frozen one-way routes
        env:
          TRIAL_ENGINE: ${{ matrix.engine }}
        run: python -m benchmarks.routing_trial --engine "$TRIAL_ENGINE" --output "results/route001-${TRIAL_ENGINE}.json"
      - name: Diagnostic scorecard including all twelve references
        env:
          TRIAL_ENGINE: ${{ matrix.engine }}
        run: python -m benchmarks.routing_trial --reports results/route001-DMN.json "results/route001-${TRIAL_ENGINE}.json" --output "results/route001-scorecard-${TRIAL_ENGINE}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: route001-${{ matrix.engine }}
          path: results/route001-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Diagnostic startup logs
        if: failure()
        run: |
          if [ -f "${RUNNER_TEMP}/route001-graphhopper.log" ]; then tail -80 "${RUNNER_TEMP}/route001-graphhopper.log"; fi
          if [ -f "${RUNNER_TEMP}/route001-ors.log" ]; then tail -80 "${RUNNER_TEMP}/route001-ors.log"; fi
          docker logs route001-reference 2>/dev/null | tail -80 || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f route001-reference >/dev/null 2>&1 || true
          if [ -f "${RUNNER_TEMP}/route001-pid" ]; then kill "$(cat "${RUNNER_TEMP}/route001-pid")" 2>/dev/null || true; fi
          sudo rm -rf results/valhalla results/graphhopper-cache results/ors-graphs
