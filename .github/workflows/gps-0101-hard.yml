name: GPS-01.01 focused hard checks
on:
  push:
    branches: ['tests/gps-01-01-hard']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gps-0101-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build original host routing helper for journey regression
        run: bash navigation_core/native/build.sh
      - name: Focused straight-road adversarial tests
        run: python -m unittest discover -s tests -p 'test_gps_0101_hard.py' -v
      - name: Synthetic GPS category and full Python regression
        run: |
          mkdir -p results
          python -m benchmarks.gps_validation
          python -m unittest discover -s tests -v
          python -m tools.privacy_guard
